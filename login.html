<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Travel With Us | Seamless Login</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="shortcut icon" href="logo.jpg" type="image/x-icon">
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			--primary: #4F46E5;
			--secondary: #8B5CF6;
		}
		
		* {
			box-sizing: border-box;
			font-family: 'Inter', sans-serif;
		}

		body {
			background: radial-gradient(circle at top left, #4F46E5, #8B5CF6, #312E81);
			display: flex;
			justify-content: center;
			align-items: center;
			flex-direction: column;
			height: 100vh;
			margin: 0;
			overflow: hidden;
		}

		h1 {
			font-family: 'Outfit', sans-serif !important;
			font-weight: 800 !important;
			margin: 0 !important;
			letter-spacing: -0.02em !important;
            font-size: 2.25rem !important;
            line-height: 1.1 !important;
		}

		p {
			font-size: 14px !important;
			font-weight: 400 !important;
			line-height: 1.5 !important;
			color: #64748b !important;
			margin: 20px 0 30px !important;
		}

		.container {
			background-color: rgba(255, 255, 255, 0.95);
			backdrop-filter: blur(20px);
			border-radius: 2rem;
			box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
			position: relative;
			overflow: hidden;
			width: 850px;
			max-width: 95%;
			min-height: 520px;
			border: 1px solid rgba(255, 255, 255, 0.2);
		}

		.form-container {
			position: absolute;
			top: 0;
			height: 100%;
			transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
		}

		form {
			background-color: transparent;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			padding: 0 50px;
			height: 100%;
			text-align: center;
		}

		.sign-in-container {
			left: 0;
			width: 50%;
			z-index: 2;
            opacity: 1;
		}

		.container.right-panel-active .sign-in-container {
			transform: translateX(100%);
            opacity: 0;
            z-index: 1;
		}

		.sign-up-container {
			left: 0;
			width: 50%;
			opacity: 0;
			z-index: 1;
		}

		.container.right-panel-active .sign-up-container {
			transform: translateX(100%);
			opacity: 1;
			z-index: 5;
			animation: show 0.6s;
		}

		@keyframes show {
			0%, 49.99% { opacity: 0; z-index: 1; }
			50%, 100% { opacity: 1; z-index: 5; }
		}

		.overlay-container {
			position: absolute;
			top: 0;
			left: 50%;
			width: 50%;
			height: 100%;
			overflow: hidden;
			transition: transform 0.6s ease-in-out;
			z-index: 100;
		}

		.container.right-panel-active .overlay-container {
			transform: translateX(-100%);
		}

		.overlay {
			background: linear-gradient(to right, #4F46E5, #8B5CF6);
			color: #FFFFFF;
			position: relative;
			left: -100%;
			height: 100%;
			width: 200%;
			transform: translateX(0);
			transition: transform 0.6s ease-in-out;
		}

		.container.right-panel-active .overlay {
			transform: translateX(50%);
		}

		.overlay-panel {
			position: absolute;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			padding: 0 40px;
			text-align: center;
			top: 0;
			height: 100%;
			width: 50%;
			transform: translateX(0);
			transition: transform 0.6s ease-in-out;
		}

		.overlay-left { transform: translateX(-20%); }
		.container.right-panel-active .overlay-left { transform: translateX(0); }
		.overlay-right { right: 0; transform: translateX(0); }
		.container.right-panel-active .overlay-right { transform: translateX(20%); }



		input {
			background-color: #f1f5f9 !important;
			border: 2px solid transparent !important;
			padding: 12px 16px !important;
			margin: 8px 0 !important;
			width: 100% !important;
			border-radius: 12px !important;
			transition: border-color 0.3s, background-color 0.3s, box-shadow 0.3s !important;
			outline: none !important;
            height: auto !important;
            color: #1e293b !important;
		}

		input:focus {
			border-color: #4F46E5 !important;
			background-color: #fff !important;
			box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1) !important;
		}

		button {
			border-radius: 12px !important;
			border: none !important;
			background-color: #4F46E5 !important;
			color: #FFFFFF !important;
			font-size: 14px !important;
			font-weight: 700 !important;
			padding: 14px 45px !important;
			letter-spacing: 1px !important;
			text-transform: uppercase !important;
			transition: transform 0.1s ease-in, background 0.3s !important;
			margin-top: 1rem !important;
			cursor: pointer !important;
            display: inline-block !important;
		}

		button:hover { background-color: #4338CA !important; }
		button:active { transform: scale(0.95) !important; }
		button.ghost {
			background-color: transparent !important;
			border: 2px solid #FFFFFF !important;
			margin-top: 2rem !important;
		}
		button.ghost:hover {
			background-color: #fff !important;
			color: #4F46E5 !important;
		}

		.social-container {
			margin: 20px 0;
		}

		.social-container a {
			border: 1px solid #e2e8f0;
			border-radius: 50%;
			display: inline-flex;
			justify-content: center;
			align-items: center;
			margin: 0 8px;
			height: 45px;
			width: 45px;
			color: #475569;
			transition: all 0.3s;
		}

		.social-container a:hover {
			background-color: #f8fafc;
			color: #4F46E5;
			border-color: #4F46E5;
			transform: translateY(-3px);
		}

		.forgot {
			color: #64748b;
			font-size: 13px;
			text-decoration: none;
			margin: 15px 0;
			transition: color 0.3s;
		}
		.forgot:hover { color: #4F46E5; }

		/* Back link */
		.back-home {
			position: fixed;
			top: 2rem;
			left: 2rem;
			color: #fff;
			text-decoration: none;
			font-weight: 600;
			display: flex;
			align-items: center;
			gap: 0.5rem;
			z-index: 200;
			background: rgba(255, 255, 255, 0.1);
			padding: 0.8rem 1.5rem;
			border-radius: 1rem;
			backdrop-filter: blur(10px);
			border: 1px solid rgba(255, 255, 255, 0.2);
			transition: all 0.3s;
		}
		.back-home:hover {
			background: rgba(255, 255, 255, 0.2);
			transform: translateX(-5px);
		}
	</style>
</head>

<body>
	<a href="index.html" class="back-home" style="font-family:'Outfit',sans-serif;letter-spacing:-0.02em;font-style:italic;"><i class="fas fa-arrow-left"></i> Back to World</a>
	
	<div class="container" id="container">
		<div class="form-container sign-up-container">
			<form id="signUpForm">
				<h1>Create Account</h1>
				<div class="social-container">
					<a href="#"><i class="fab fa-facebook-f"></i></a>
					<a href="#"><i class="fab fa-google-plus-g"></i></a>
					<a href="#"><i class="fab fa-linkedin-in"></i></a>
				</div>
				<span style="font-size:0.75rem;color:#94a3b8;font-style:italic;">or use your email for registration</span>
				<input type="text" placeholder="Full Name" required />
				<input type="email" placeholder="Email Address" required />
				<input type="password" placeholder="Password" required />
				<button type="submit">Sign Up</button>
			</form>
		</div>
		<div class="form-container sign-in-container">
			<form id="signInForm">
				<h1>Sign in</h1>
				<div class="social-container">
					<a href="#"><i class="fab fa-facebook-f"></i></a>
					<a href="#"><i class="fab fa-google-plus-g"></i></a>
					<a href="#"><i class="fab fa-linkedin-in"></i></a>
				</div>
				<span style="font-size:0.75rem;color:#94a3b8;font-style:italic;">or use your existing account</span>
				<input type="email" placeholder="Email Address" required />
				<input type="password" placeholder="Password" required />
				<a href="#" class="forgot italic">Forgot your password?</a>
				<button type="submit">Sign In</button>
			</form>
		</div>
		<div class="overlay-container">
			<div class="overlay italic">
				<div class="overlay-panel overlay-left">
					<h1 style="color:#fff;">Welcome Back!</h1>
					<p style="color:rgba(255,255,255,0.8);">To keep connected with us please login with your personal info</p>
					<button class="ghost" id="signIn">Sign In</button>
				</div>
				<div class="overlay-panel overlay-right">
					<h1 style="color:#fff;">Begin Adventure</h1>
					<p style="color:rgba(255,255,255,0.8);">Enter your personal details and start your premium journey with us</p>
					<button class="ghost" id="signUp">Sign Up</button>
				</div>
			</div>
		</div>
	</div>

	<script>
		const signUpButton = document.getElementById('signUp');
		const signInButton = document.getElementById('signIn');
		const container = document.getElementById('container');

		signUpButton.addEventListener('click', () => {
			container.classList.add('right-panel-active');
		});

		signInButton.addEventListener('click', () => {
			container.classList.remove('right-panel-active');
		});

		// Simulate Login/Sign-up SUCCESS
		const handleAuth = (e) => {
			e.preventDefault();
			const btn = e.target.querySelector('button');
			const originalText = btn.textContent;
			btn.textContent = 'Verifying...';
			btn.disabled = true;
			
			setTimeout(() => {
				btn.textContent = 'Welcome! Redirecting...';
				btn.style.background = '#10b981';
				setTimeout(() => {
					window.location.href = 'index.html';
				}, 1000);
			}, 1500);
		};

		document.getElementById('signInForm').addEventListener('submit', handleAuth);
		document.getElementById('signUpForm').addEventListener('submit', handleAuth);
	</script>
</body>

</html>
